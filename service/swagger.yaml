openapi: 3.0.0
info:
  title: Mocktale API
  description: API for Mocktale application
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /projects:
    get:
      summary: Get all projects
      responses:
        '200':
          description: A list of projects
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Created project
  /apis:
    post:
      summary: Create an API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: integer
                name:
                  type: string
                method:
                  type: string
                endpoint:
                  type: string
                response_body:
                  type: object
                response_status:
                  type: integer
      responses:
        '200':
          description: Created API
